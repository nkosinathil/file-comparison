<VirtualHost *:80>
    ServerName aurex.example.com
    ServerAdmin admin@example.com
    
    DocumentRoot /var/www/aurex/php-app/public
    
    <Directory /var/www/aurex/php-app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Rewrite rules for front controller
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>
    
    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Proxy to Python backend
    ProxyPreserveHost On
    ProxyPass /api http://localhost:8000/api
    ProxyPassReverse /api http://localhost:8000/api
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/aurex-error.log
    CustomLog ${APACHE_LOG_DIR}/aurex-access.log combined
    
    # PHP Configuration
    php_value upload_max_filesize 50M
    php_value post_max_size 50M
    php_value memory_limit 256M
    php_value max_execution_time 300
</VirtualHost>

