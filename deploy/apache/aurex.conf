# ==============================================================================
# Aurex Web Application - Apache Virtual Host Configuration
# Server: 192.168.1.66 (Application Server)
# ==============================================================================
# 
# This configuration assumes:
# - Apache 2.4+
# - PHP 8.1+ with PHP-FPM
# - Document root: /var/www/gismartanalytics/public
# - Application code: /var/www/gismartanalytics/php-app
#
# Installation:
# 1. Copy this file to /etc/apache2/sites-available/aurex.conf
# 2. Enable required modules:
#    sudo a2enmod rewrite proxy_fcgi setenvif
# 3. Enable PHP-FPM:
#    sudo a2enconf php8.1-fpm
# 4. Enable site:
#    sudo a2ensite aurex
# 5. Reload Apache:
#    sudo systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
    # Server identification
    ServerName aurex.local
    ServerAlias 192.168.1.66
    ServerAdmin admin@aurex.local
    
    # Document root (PHP application public directory)
    DocumentRoot /var/www/gismartanalytics/public
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/aurex_error.log
    CustomLog ${APACHE_LOG_DIR}/aurex_access.log combined
    
    # PHP-FPM configuration
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>
    
    # Directory configuration
    <Directory /var/www/gismartanalytics/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # URL rewriting for clean URLs
        RewriteEngine On
        
        # Redirect to front controller if file doesn't exist
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>
    
    # Deny access to sensitive files
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>
    
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>
    
    # Security headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    
    # Disable server signature
    ServerSignature Off
    
    # File upload limits (adjust as needed)
    # Ensure these match php.ini settings
    php_value upload_max_filesize 100M
    php_value post_max_size 100M
    php_value max_execution_time 300
    php_value max_input_time 300
    
</VirtualHost>

