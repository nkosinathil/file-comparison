# Aurex Bank Statement Intelligence - Docker Compose
# Production-ready deployment configuration

version: '3.8'

services:
  # Python API Server
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: aurex-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=4
      - LOG_LEVEL=info
    volumes:
      - ./aurex_bank_analyzer:/app/aurex_bank_analyzer
      - ./api:/app/api
      - ./data:/app/data
      - api_logs:/app/logs
    networks:
      - aurex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PHP Web Application
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: aurex-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PHP_MEMORY_LIMIT=256M
      - PHP_UPLOAD_MAX_FILESIZE=50M
      - PHP_POST_MAX_SIZE=50M
      - API_BASE_URL=http://api:8000
      - SSO_ENABLED=false
      - SECURE_COOKIES=false
    volumes:
      - ./web:/var/www/html
      - ./data:/var/www/html/data
      - web_logs:/var/log/nginx
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - aurex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (optional for production)
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: aurex-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ssl_certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
    networks:
      - aurex-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  api_logs:
    driver: local
  web_logs:
    driver: local
  nginx_logs:
    driver: local
  ssl_certs:
    driver: local

networks:
  aurex-network:
    driver: bridge
